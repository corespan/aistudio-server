# GENERATED by `make registry` from agent-runner/platform/ (packs/*/connectors/*.yaml). Don't edit:
# change the connector file and re-render; agent-runner's tests fail when this file is stale.
#
# agentgateway verifies the caller's JWT on every route. MCP routes pass it through, so each server
# verifies it again; the LLM route swaps it for LLM_API_KEY. /github (the runner's PRs and reviews,
# after your approval) checks the JWT, the sub and the exact REST call, then adds GITHUB_PAT.
# Admin UI and config dump: loopback only.
# agentgateway reads jwks.json only at start: after `make mcp-init`, restart it.
config:
  adminAddr: 127.0.0.1:15000
binds:
- port: 8050
  listeners:
  - routes:
    - matches:
      - path:
          pathPrefix: /llm
      backends:
      - ai:
          name: llm
          hostOverride: ${LLM_HOST}
          pathOverride: /v1/chat/completions
          provider:
            openAI:
              model: ${LLM_MODEL}
      policies:
        jwtAuth: &id001
          mode: strict
          jwtValidationOptions:
            requiredClaims:
            - exp
            - iat
            - sub
            - iss
            - aud
          issuer: aistudio
          audiences:
          - agentgateway
          jwks:
            file: /config/jwks.json
        backendAuth:
          key: ${LLM_API_KEY}
    - matches:
      - path:
          pathPrefix: /mcp/aistudio
      backends:
      - mcp:
          targets:
          - name: aistudio
            mcp:
              host: http://aistudio-mcp:8081/mcp
      policies:
        cors:
          allowOrigins:
          - '*'
          allowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
          allowHeaders:
          - authorization
          - content-type
          - accept
          - mcp-session-id
          - mcp-protocol-version
          - last-event-id
          exposeHeaders:
          - mcp-session-id
          - www-authenticate
          maxAge: 600s
        requestHeaderModifier:
          remove:
          - origin
        jwtAuth: *id001
        backendAuth:
          passthrough: {}
        mcpAuthorization:
          rules:
          - jwt.roles.aistudio in ['viewer', 'operator', 'admin'] && mcp.tool.name in ['workload_history', 'throughput_compare', 'check_service_health', 'platform_catalog', 'list_benchmarks', 'get_benchmark', 'summary', 'model_config', 'get_task_status', 'get_task_logs']
          - jwt.roles.aistudio in ['operator', 'admin'] && mcp.tool.name in ['start_workload', 'start_jupyter', 'stop_workload']
          - jwt.roles.aistudio in ['admin'] && mcp.tool.name in ['timeline', 'list_containers', 'docker_logs', 'inspect_container', 'container_diff', 'read_file', 'list_dir', 'grep_logs', 'git_log', 'git_show', 'network_check', 'list_listening_ports', 'tcpdump_capture', 'check_tls_cert', 'check_clock_skew', 'frontend_check', 'queue_status', 'check_ssh_connectivity', 'check_node_docker', 'node_docker_logs', 'node_exec']
    - matches:
      - path:
          pathPrefix: /mcp/sandbox
      backends:
      - mcp:
          targets:
          - name: sandbox
            mcp:
              host: http://sandbox-mcp:8082/mcp
      policies:
        jwtAuth: *id001
        backendAuth:
          passthrough: {}
        mcpAuthorization:
          rules:
          - jwt.roles.aistudio in ['viewer', 'operator', 'admin'] && mcp.tool.name in ['sandbox_run']
          - jwt.roles.aistudio in ['operator', 'admin'] && mcp.tool.name in ['workspace_open', 'workspace_claude', 'workspace_exec', 'workspace_diff', 'workspace_files', 'workspace_close']
    - matches:
      - path:
          pathPrefix: /github/
      backends:
      - host: api.github.com:443
      policies:
        jwtAuth: *id001
        authorization:
          rules:
          - jwt.sub in ['rsingh'] && ((request.method == 'GET' && request.path.matches('^/github/repos/(corespan/aistudio-server)/(pulls/[0-9]+|pulls/[0-9]+/comments|issues/[0-9]+/comments|git/commits/[0-9a-f]{40}|commits/[0-9a-f]{40}/check-runs|check-runs/[0-9]+/annotations)$')) || (request.method == 'POST' && request.path.matches('^/github/repos/(corespan/aistudio-server)/(git/(blobs|trees|commits|refs)|pulls|pulls/[0-9]+/reviews|pulls/[0-9]+/requested_reviewers|issues/[0-9]+/comments)$')) || (request.method == 'PATCH' && request.path.matches('^/github/repos/(corespan/aistudio-server)/git/refs/heads/agent/[A-Za-z0-9._/-]+$') && !request.path.contains('..')))
        localRateLimit:
        - type: requests
          maxTokens: 60
          tokensPerFill: 60
          fillInterval: 60s
        urlRewrite:
          authority:
            full: api.github.com
          path:
            prefix: /
        backendTLS: {}
        requestHeaderModifier:
          set:
            authorization: Bearer ${GITHUB_PAT}
            user-agent: aistudio-agent-runner
            accept: application/vnd.github+json
            x-github-api-version: '2022-11-28'
