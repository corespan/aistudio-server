# GENERATED by `make registry` from agent-runner/platform/ (packs/*/connectors/*.yaml). Don't edit:
# change the connector file and re-render; agent-runner's tests fail when this file is stale.
#
# Every token is Keycloak's (realm aistudio); agentgateway checks it on the /mcp, /llm and
# /github routes; on /assistant/ agent-runner checks it. :8050 is HTTPS for MCP clients and the assistant panel outside, who
# log in to Keycloak through it (OAuth, PKCE). :8052 is plain HTTP for
# agent-runner inside the compose network, never published: /llm swaps the token for LLM_API_KEY,
# /mcp/<name> passes it through so each server checks it again, and /github (the runner's PRs and
# reviews, after your approval) checks the user and the exact REST call, then adds GITHUB_PAT.
# ${MCP_PUBLIC_URL} comes from docker-compose.yml. Admin UI and config dump: loopback only.
config:
  adminAddr: 127.0.0.1:15000
binds:
- port: 8050
  listeners:
  - protocol: HTTPS
    tls:
      cert: /config/tls/cert.pem
      key: /config/tls/key.pem
    routes:
    - matches:
      - path:
          pathPrefix: /mcp/aistudio
      - path:
          exact: /.well-known/oauth-protected-resource/mcp/aistudio
      backends:
      - mcp:
          targets:
          - name: aistudio
            mcp:
              host: http://aistudio-mcp:8081/mcp
      policies:
        cors:
          allowOrigins:
          - '*'
          allowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
          allowHeaders:
          - authorization
          - content-type
          - accept
          - mcp-session-id
          - mcp-protocol-version
          - last-event-id
          exposeHeaders:
          - mcp-session-id
          - www-authenticate
          maxAge: 600s
        requestHeaderModifier:
          remove:
          - origin
        mcpAuthentication:
          mode: strict
          issuer: ${MCP_PUBLIC_URL}/realms/aistudio
          audiences:
          - aistudio-mcp
          jwks: &id004
            url: http://keycloak:8080/realms/aistudio/protocol/openid-connect/certs
          resourceMetadata:
            resource: ${MCP_PUBLIC_URL}/mcp/aistudio
            scopesSupported:
            - openid
            bearerMethodsSupported:
            - header
        backendAuth:
          passthrough: {}
        mcpAuthorization:
          rules: &id006
          - jwt.roles.aistudio in ['viewer', 'operator', 'admin'] && mcp.tool.name in ['workload_history', 'throughput_compare', 'check_service_health', 'platform_catalog', 'list_benchmarks', 'get_benchmark', 'summary', 'model_config', 'get_task_status', 'get_task_logs']
          - jwt.roles.aistudio in ['operator', 'admin'] && mcp.tool.name in ['start_workload', 'start_jupyter', 'stop_jupyter', 'delete_run_results']
          - jwt.roles.aistudio in ['admin'] && mcp.tool.name in ['timeline', 'list_containers', 'docker_logs', 'inspect_container', 'container_diff', 'read_file', 'list_dir', 'grep_logs', 'git_log', 'git_show', 'network_check', 'list_listening_ports', 'tcpdump_capture', 'check_tls_cert', 'check_clock_skew', 'frontend_check', 'queue_status', 'check_ssh_connectivity', 'check_node_docker', 'node_docker_logs', 'node_exec']
    - matches:
      - path:
          exact: /.well-known/oauth-authorization-server/realms/aistudio
      backends:
      - host: keycloak:8080
      policies:
        cors: &id001
          allowOrigins:
          - '*'
          allowMethods:
          - GET
          - POST
          - OPTIONS
          allowHeaders:
          - content-type
          - authorization
          - mcp-protocol-version
          maxAge: 600s
        requestHeaderModifier: &id002
          set:
            x-forwarded-proto: https
          remove:
          - origin
          - x-forwarded-host
          - x-forwarded-port
        transformations: &id003
          request:
            set:
              x-forwarded-for: source.address
        urlRewrite:
          path:
            full: /realms/aistudio/.well-known/oauth-authorization-server
    - matches:
      - path:
          exact: /.well-known/openid-configuration/realms/aistudio
      backends:
      - host: keycloak:8080
      policies:
        cors: *id001
        requestHeaderModifier: *id002
        transformations: *id003
        urlRewrite:
          path:
            full: /realms/aistudio/.well-known/openid-configuration
    - matches:
      - path:
          pathPrefix: /realms/aistudio/protocol/openid-connect/
      - path:
          pathPrefix: /realms/aistudio/login-actions/
      - path:
          pathPrefix: /realms/aistudio/.well-known/
      - path:
          exact: /realms/aistudio/clients-registrations/openid-connect
      - path:
          pathPrefix: /realms/aistudio/account
      - path:
          pathPrefix: /resources/
      backends:
      - host: keycloak:8080
      policies:
        cors: *id001
        requestHeaderModifier: *id002
        transformations: *id003
    - matches:
      - path:
          pathPrefix: /assistant/
      backends:
      - host: agent-runner:8060
      policies:
        urlRewrite:
          path:
            prefix: /
- port: 8052
  listeners:
  - routes:
    - matches:
      - path:
          pathPrefix: /llm
      backends:
      - ai:
          name: llm
          hostOverride: ${LLM_HOST}
          pathOverride: /v1/chat/completions
          provider:
            openAI:
              model: ${LLM_MODEL}
      policies:
        jwtAuth: &id005
          mode: strict
          jwtValidationOptions:
            requiredClaims:
            - exp
            - iat
            - sub
            - iss
            - aud
          issuer: ${MCP_PUBLIC_URL}/realms/aistudio
          audiences:
          - aistudio-mcp
          jwks: *id004
        backendAuth:
          key: ${LLM_API_KEY}
    - matches:
      - path:
          pathPrefix: /mcp/aistudio
      backends:
      - mcp:
          targets:
          - name: aistudio
            mcp:
              host: http://aistudio-mcp:8081/mcp
      policies:
        jwtAuth: *id005
        backendAuth:
          passthrough: {}
        mcpAuthorization:
          rules: *id006
    - matches:
      - path:
          pathPrefix: /mcp/sandbox
      backends:
      - mcp:
          targets:
          - name: sandbox
            mcp:
              host: http://sandbox-mcp:8082/mcp
      policies:
        jwtAuth: *id005
        backendAuth:
          passthrough: {}
        mcpAuthorization:
          rules:
          - jwt.roles.aistudio in ['viewer', 'operator', 'admin'] && mcp.tool.name in ['sandbox_run']
          - jwt.roles.aistudio in ['operator', 'admin'] && mcp.tool.name in ['workspace_open', 'workspace_claude', 'workspace_exec', 'workspace_diff', 'workspace_files', 'workspace_close']
    - matches:
      - path:
          pathPrefix: /github/
      backends:
      - host: api.github.com:443
      policies:
        jwtAuth: *id005
        authorization:
          rules:
          - jwt.preferred_username in ['rsingh'] && ((request.method == 'GET' && request.path.matches('^/github/repos/(corespan/aistudio-server)/(pulls/[0-9]+|pulls/[0-9]+/comments|issues/[0-9]+/comments|git/commits/[0-9a-f]{40}|commits/[0-9a-f]{40}/check-runs|check-runs/[0-9]+/annotations)$')) || (request.method == 'POST' && request.path.matches('^/github/repos/(corespan/aistudio-server)/(git/(blobs|trees|commits|refs)|pulls|pulls/[0-9]+/reviews|pulls/[0-9]+/requested_reviewers|issues/[0-9]+/comments)$')) || (request.method == 'PATCH' && request.path.matches('^/github/repos/(corespan/aistudio-server)/git/refs/heads/agent/[A-Za-z0-9._/-]+$') && !request.path.contains('..')))
        localRateLimit:
        - type: requests
          maxTokens: 60
          tokensPerFill: 60
          fillInterval: 60s
        urlRewrite:
          authority:
            full: api.github.com
          path:
            prefix: /
        backendTLS: {}
        requestHeaderModifier:
          set:
            authorization: Bearer ${GITHUB_PAT}
            user-agent: aistudio-agent-runner
            accept: application/vnd.github+json
            x-github-api-version: '2022-11-28'
