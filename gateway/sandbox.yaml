# GENERATED by `make registry` from agent-runner/platform/ (packs/*/models/*.yaml). Don't edit.
#
# agentgateway-sandbox: the only thing workspace sandboxes can reach (network sandbox-egress, no
# other route out). Its own container because agentgateway can't bind a listener to one network:
# on the main gateway, sandboxes could also reach /mcp/* and /llm. /llm/anthropic checks the JWT and
# its sub, then swaps it for your Claude subscription token, which only this container holds.
config:
  adminAddr: 127.0.0.1:15000
binds:
- port: 8051
  listeners:
  - routes:
    - matches:
      - path:
          pathPrefix: /llm/anthropic
      backends:
      - host: api.anthropic.com:443
      policies:
        jwtAuth: &id001
          mode: strict
          jwtValidationOptions:
            requiredClaims:
            - exp
            - iat
            - sub
            - iss
            - aud
          issuer: aistudio
          audiences:
          - agentgateway
          jwks:
            file: /config/jwks.json
        authorization:
          rules:
          - jwt.sub in ['rsingh']
        localRateLimit:
        - type: requests
          maxTokens: 60
          tokensPerFill: 60
          fillInterval: 60s
        urlRewrite:
          authority:
            full: api.anthropic.com
          path:
            prefix: /
        backendTLS: {}
        requestHeaderModifier:
          set:
            authorization: Bearer ${CLAUDE_CODE_OAUTH_TOKEN}
          add:
            anthropic-beta: oauth-2025-04-20
          remove:
          - x-api-key
    - matches:
      - path:
          exact: /git/corespan/aistudio-server.git/info/refs
        method: GET
        query:
        - name: service
          value:
            exact: git-upload-pack
      backends:
      - host: github.com:443
      policies:
        jwtAuth: *id001
        backendTLS: &id002 {}
        requestHeaderModifier: &id003
          remove:
          - authorization
        urlRewrite:
          authority:
            full: github.com
          path:
            full: /corespan/aistudio-server.git/info/refs
    - matches:
      - path:
          exact: /git/corespan/aistudio-server.git/git-upload-pack
        method: POST
      backends:
      - host: github.com:443
      policies:
        jwtAuth: *id001
        backendTLS: *id002
        requestHeaderModifier: *id003
        urlRewrite:
          authority:
            full: github.com
          path:
            full: /corespan/aistudio-server.git/git-upload-pack
