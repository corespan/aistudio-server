services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aistudio
      POSTGRES_PASSWORD: aistudio
      POSTGRES_DB: aistudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistudio"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aistudio
      RABBITMQ_DEFAULT_PASS: aistudio
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: rabbitmq
    volumes:
      - .:/AIStudio
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2 -Q celery
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: rabbitmq
    volumes:
      - .:/AIStudio
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
