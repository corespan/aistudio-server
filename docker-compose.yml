services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aistudio
      POSTGRES_PASSWORD: aistudio
      POSTGRES_DB: aistudio
    # Default passwords: this host only (ssh -L to reach it from elsewhere).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistudio"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aistudio
      RABBITMQ_DEFAULT_PASS: aistudio
    # Default passwords: this host only (ssh -L to reach it from elsewhere).
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8002:8001"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: rabbitmq
    # Read-only: the app writes only nginx's Jupyter config (its own volume); a compromised API cannot
    # edit the gateway config, Makefile or helper scripts the next make mcp-up runs.
    volumes:
      - .:/AIStudio:ro
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    healthcheck:
      # 503 while PostgreSQL is unreachable (app/routers/system.py).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2 -Q celery
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: rabbitmq
    volumes:
      - .:/AIStudio:ro                     # as api
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
      - jupyter-locations:/etc/nginx/jupyter-locations
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    build: ./nginx
    ports:
      - "8443:8443"
    volumes:
      - jupyter-locations:/etc/nginx/jupyter-locations
    restart: unless-stopped
    depends_on:
      - api

  # ── MCP (profile: mcp): make mcp-up (see docs/mcp-server.md) ──
  # MCP clients reach the tools at https://<MCP_PUBLIC_HOST>:8050/mcp/aistudio and log in to Keycloak there.
  agentgateway:
    profiles: ["mcp"]
    image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    command: ["-f", "/config/config.yaml"]
    # :8050 (published) is HTTPS for MCP clients outside; :8052 is for agent-runner inside the
    # compose network only (/llm, /mcp/*, /github), never published.
    ports:
      - "${AGW_PORT:-8050}:8050"
    environment:
      MCP_PUBLIC_URL: "https://${MCP_PUBLIC_HOST:-localhost}:${AGW_PORT:-8050}"
      # The LLM route (/llm) for agent-runner: an OpenAI-compatible server, host:port. Unset: the
      # route answers 503 and the MCP route is unaffected.
      LLM_HOST: "${LLM_HOST:-llm-unset.invalid:8000}"
      LLM_MODEL: "${LLM_MODEL:-}"           # the served model every logical name maps to
      LLM_API_KEY: "${LLM_API_KEY:-none}"   # the LLM server's own key; callers' JWTs never reach it
      # Your fine-grained GitHub token for /github: the coding workflows' draft PRs and reviews,
      # after your approval (docs/agent-runner.md#approval-and-github). Only this container holds it.
      GITHUB_PAT: "${GITHUB_PAT:-}"
    volumes:
      - ./gateway/config.yaml:/config/config.yaml:ro
      - ${MCP_SECRETS_DIR:-~/.aistudio-mcp}/tls:/config/tls:ro    # cert, key, ca.pem (make mcp-init)
    depends_on:
      aistudio-mcp:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # Users, roles and logins for MCP clients. Login pages are served through agentgateway's TLS port;
  # the admin console only on this host (ssh -L 8180:localhost:8180 to reach it).
  keycloak:
    profiles: ["mcp"]
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: ["start", "--import-realm"]
    env_file:                              # admin and DB passwords (make mcp-init)
      - path: ${MCP_SECRETS_DIR:-~/.aistudio-mcp}/keycloak.env
        required: false
    environment:
      KC_HOSTNAME: "https://${MCP_PUBLIC_HOST:-localhost}:${AGW_PORT:-8050}"
      KC_HOSTNAME_ADMIN: "http://localhost:8180"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      # Its own database and role in the shared postgres (gateway/keycloak/db.sql, make mcp-db).
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
    volumes:
      - ./gateway/keycloak/aistudio-realm.json:/opt/keycloak/data/import/aistudio-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # The only thing workspace sandboxes reach: /llm/anthropic on :8051 (gateway/sandbox.yaml, from
  # make registry). Its own container because agentgateway can't bind a listener to one network.
  # Not published on the host. docs/agent-runner.md#the-anthropic-route
  agentgateway-sandbox:
    profiles: ["mcp"]
    image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    command: ["-f", "/config/sandbox.yaml"]
    environment:
      # Your Claude subscription (`claude setup-token`). Only this container holds it: sandboxes
      # send the caller's Keycloak token and the gateway swaps it. Unset: Anthropic answers 401.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      MCP_PUBLIC_URL: "https://${MCP_PUBLIC_HOST:-localhost}:${AGW_PORT:-8050}"   # the tokens' issuer
    volumes:
      - ./gateway/sandbox.yaml:/config/sandbox.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy         # its keys, for the token check
    networks:
      default: {}                          # its way out to api.anthropic.com
      sandbox-egress:
        # Fixed, because gVisor can't use Docker's DNS: workspaces get --add-host agentgateway-sandbox:<this>.
        ipv4_address: 172.30.51.10
    restart: unless-stopped

  # The AI Assistant backend and the coding workflows: http://<host>:8060 (docs/agent-runner.md).
  # It holds no keys and reaches tools and the LLM only through agentgateway's inside listener,
  # with the caller's own Keycloak token.
  agent-runner:
    profiles: ["mcp"]
    build: ./agent-runner
    ports:
      - "${RUNNER_PORT:-8060}:8060"
    environment:
      GATEWAY_URL: "http://agentgateway:8052"
      LLM_BASE_URL: "http://agentgateway:8052/llm/v1"
      # LangGraph checkpoints and the run log; the database is created on first start.
      DATABASE_URL: "postgresql://aistudio:aistudio@postgres:5432/agent_runner"
      # Keycloak's tokens (realm aistudio), audience agent-runner: keys from Keycloak, issuer as clients see it.
      JWKS_URL: "http://keycloak:8080/realms/aistudio/protocol/openid-connect/certs"
      JWT_ISSUER: "https://${MCP_PUBLIC_HOST:-localhost}:${AGW_PORT:-8050}/realms/aistudio"
      # Langfuse traces, off unless all three are set (docs/agent-runner.md#traces).
      LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      agentgateway:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8060/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  aistudio-mcp:
    profiles: ["mcp"]
    build: ./mcp-server
    # No published port: agentgateway reaches it at http://aistudio-mcp:8081/mcp (gateway/config.yaml).
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8081"
      # agentgateway sends Host: aistudio-mcp with no port, so list both spellings.
      MCP_ALLOWED_HOSTS: "aistudio-mcp,aistudio-mcp:8081"
      # The same Keycloak tokens agentgateway checks: keys from Keycloak, issuer as clients see it.
      MCP_JWKS_URL: "http://keycloak:8080/realms/aistudio/protocol/openid-connect/certs"
      MCP_JWT_ISSUER: "https://${MCP_PUBLIC_HOST:-localhost}:${AGW_PORT:-8050}/realms/aistudio"
      MCP_JWT_AUDIENCE: "aistudio-mcp"
      # start_workload / start_jupyter / stop_jupyter / delete_run_results exist only when true.
      # stop_jupyter and delete_run_results: the task's creator (workloads.created_by, set from the
      # Keycloak user id) or an admin. That binds MCP users only: the REST API on 8002 has no authentication.
      MCP_WRITES_ENABLED: "${MCP_WRITES_ENABLED:-false}"
      AISTUDIO_API_URL: "http://api:8001"
      RABBITMQ_MGMT_URL: "http://rabbitmq:15672"
      # Monitoring-only user (make mcp-rabbit), not the broker's admin; its password is the
      # rabbitmq_password secret below, so it is not in this container's env either.
      RABBITMQ_USER: "aistudio-mcp"
      DOCKER_HOST: "tcp://aistudio-docker-proxy:2375"
      SSH_KEY_PATH: "/root/.ssh/id_rsa"
      SSH_DEFAULT_USER: "${SSH_DEFAULT_USER:-ubuntu}"
      # SSH known_hosts on the aistudio-mcp-data volume.
      SSH_KNOWN_HOSTS: "/data/ssh/known_hosts"
      SSH_HOST_KEY_POLICY: "${SSH_HOST_KEY_POLICY:-tofu}"
      # The GPU node subnets the node probes may reach. Empty = node probes off.
      NODE_ALLOWED_CIDRS: "${NODE_ALLOWED_CIDRS:-}"
      REPO_PATH: "/repo"
      READABLE_ROOTS: "/repo,/var/log"
    # Tracked source read-only (never .env) and the SSH key; never MCP_SECRETS_DIR.
    volumes:
      - aistudio-mcp-data:/data
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
      - ./.git:/repo/.git:ro
      - ./app:/repo/app:ro
      - ./alembic:/repo/alembic:ro
      - ./alembic.ini:/repo/alembic.ini:ro
      - ./docs:/repo/docs:ro
      - ./scripts:/repo/scripts:ro
      - ./tests:/repo/tests:ro
      - ./catalog.json:/repo/catalog.json:ro
      - ./Dockerfile:/repo/Dockerfile:ro
      - ./docker-compose.yml:/repo/docker-compose.yml:ro
      - ./requirements.txt:/repo/requirements.txt:ro
      - ./README.md:/repo/README.md:ro
      - /var/log:/var/log:ro
    # tcpdump: NET_RAW, SETUID/SETGID to drop to its user, KILL to stop it; DAC_READ_SEARCH: key, /var/log.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SETUID
      - SETGID
      - KILL
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
      # Docker's default profile (moby/profiles@6fe7deb) minus open_by_handle_at / name_to_handle_at:
      # with DAC_READ_SEARCH those open host files by handle through any bind mount ("Shocker").
      - seccomp=./mcp-server/seccomp.json
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - rabbitmq_password      # /run/secrets/rabbitmq_password, read by app/config.py
    networks:
      - default
      - mcp-docker
    depends_on:
      - api
      - aistudio-docker-proxy
      - keycloak
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Read-only Docker API for the MCP's container tools, on a network only aistudio-mcp joins.
  aistudio-docker-proxy:
    profiles: ["mcp"]
    # GET on containers lets a caller read any container's env (/json) and files (/archive): only
    # aistudio-mcp, on an internal network, reaches it, and its tools never print either.
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mcp-docker
    restart: unless-stopped

  # sandbox_run: programs in disposable gVisor containers with no network (docs/sandbox.md).
  # Needs the runsc runtime on the Docker host. Reached only through agentgateway (/mcp/sandbox).
  sandbox-mcp:
    profiles: ["mcp"]
    build: ./sandbox-mcp
    environment:
      DOCKER_HOST: "tcp://sandbox-docker-proxy:2375"
      # Keycloak's tokens (realm aistudio), audience mcp:sandbox.
      SANDBOX_JWKS_URL: "http://keycloak:8080/realms/aistudio/protocol/openid-connect/certs"
      SANDBOX_JWT_ISSUER: "https://${MCP_PUBLIC_HOST:-localhost}:${AGW_PORT:-8050}/realms/aistudio"
      SANDBOX_RUNTIME: "${SANDBOX_RUNTIME:-runsc}"
      SANDBOX_IMAGE: "${SANDBOX_IMAGE:-python:3.11-slim}"
      # Workspaces (docs/sandbox.md#workspaces): built by make mcp-up; containers join sandbox-egress.
      SANDBOX_WORKSPACE_IMAGE: "aistudio-workspace:local"
      SANDBOX_WORKSPACE_NETWORK: "aistudio-sandbox-egress"
      SANDBOX_WORKSPACE_GATEWAY_IP: "172.30.51.10"
    volumes:
      - sandbox-workspaces:/var/lib/sandbox/workspaces   # snapshots, deleted on close or after 24h
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - default
      - sandbox-docker
    depends_on:
      - sandbox-docker-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # The Docker API sandbox-mcp may use: containers only (create, start, wait, logs, copy, kill,
  # remove). No exec, images, networks, volumes or build. It can still create any container, so
  # whoever controls sandbox-mcp controls the host: it is small, has no LLM, and only the gateway
  # reaches it.
  sandbox-docker-proxy:
    profiles: ["mcp"]
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 1
      VERSION: 1
      PING: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-docker
    restart: unless-stopped

secrets:
  rabbitmq_password:
    file: ${MCP_SECRETS_DIR:-~/.aistudio-mcp}/rabbitmq_password   # make mcp-env

networks:
  mcp-docker:
    internal: true
  sandbox-docker:
    internal: true
  # Workspace sandboxes and agentgateway-sandbox, nothing else: no route to the internet.
  sandbox-egress:
    name: aistudio-sandbox-egress        # sandbox-mcp names it when it creates a workspace
    internal: true
    ipam:
      config:
        - subnet: 172.30.51.0/24

volumes:
  pgdata:
  jupyter-locations:
  aistudio-mcp-data:
  sandbox-workspaces:
