kind: agent
name: diagnostics
purpose: >-
  Why something failed or is slow: a run's lifecycle and logs, service health, the queue, the
  containers, files and network on this host, and the GPU nodes over SSH.
model: worker
tools:
  - aistudio/workload_history
  - aistudio/get_task_status
  - aistudio/get_task_logs
  - aistudio/check_service_health
  - aistudio/queue_status
  - aistudio/timeline
  - aistudio/list_containers
  - aistudio/docker_logs
  - aistudio/inspect_container
  - aistudio/container_diff
  - aistudio/read_file
  - aistudio/list_dir
  - aistudio/grep_logs
  - aistudio/git_log
  - aistudio/git_show
  - aistudio/network_check
  - aistudio/list_listening_ports
  - aistudio/check_tls_cert
  - aistudio/check_clock_skew
  - aistudio/frontend_check
  - aistudio/check_ssh_connectivity
  - aistudio/check_node_docker
  - aistudio/node_docker_logs
  - aistudio/node_exec
  # On the user's screen (panel-tools.json): the browser runs these; none writes.
  - panel/show_run
  - panel/view_run_progress
  - panel/view_jupyter_progress
budgets: { steps: 8, tokens: 80000, seconds: 300 }
