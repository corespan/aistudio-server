server {
    listen 8443;
    server_name _;

    # Extended timeouts for SSE log streaming
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # FastAPI — REST API and health probe
    location /api/ {
        proxy_pass http://api:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Required for SSE (log streaming) — disable buffering
        proxy_buffering off;
        proxy_cache     off;
    }

    location /health {
        proxy_pass http://api:8001/health;
        proxy_set_header Host $host;
    }

    # Per-instance Jupyter location files.
    # Written by the aistudio-server worker when a Jupyter session starts,
    # deleted when it ends. inotifywait inside this container auto-reloads
    # nginx whenever a file is added or removed.
    include /etc/nginx/jupyter-locations/*.conf;
}
